services:
  app:
    image: node:22-alpine
    container_name: habits-app
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://habits:habits_dev@postgres:5432/habits_local
      PORT: 3001
    ports:
      - "3002:3001"
      - "5175:5173"
    volumes:
      - .:/app
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: habits-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: habits_local
      POSTGRES_USER: habits
      POSTGRES_PASSWORD: habits_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
