services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: habits-app-prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://habits:habits_dev@db:5432/habits_local}
    ports:
      - "3001:3001"
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: habits-db-prod
    environment:
      POSTGRES_DB: habits_local
      POSTGRES_USER: habits
      POSTGRES_PASSWORD: habits_dev
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    ports:
      - "5433:5432"

volumes:
  postgres_prod_data:
